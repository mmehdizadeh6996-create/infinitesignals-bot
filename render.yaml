services:
  - type: web
    name: infinitesignals-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: TRONGRID_API_KEY
        sync: false
      - key: USDT_WALLET
        value: TGxbTVemMshonvKXxvKgo5yEkPQJgTjREN
      - key: PRICE_1M
        value: "99"
      - key: PRICE_6M
        value: "499"
      - key: PRICE_12M
        value: "999"
