services:
  - type: worker
    name: infinitesignals-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: TRONGRID_API_KEY
        sync: false
      - key: USDT_WALLET
        value: TGxbTVemMshonvKXxvKgo5yEkPQJgTjREN
      - key: PRICE_1M
        value: "99"
      - key: PRICE_6M
        value: "499"
      - key: PRICE_12M
        value: "999"
      - key: DATABASE_URL
        fromDatabase:
          name: infinitesignals-db
          property: connectionString

databases:
  - name: infinitesignals-db
    plan: basic-256mb
